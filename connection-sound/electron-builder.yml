appId: com.connectionsound.app
productName: Connection Sound
copyright: Connection Sound

directories:
  buildResources: build
  output: release

files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,tsconfig.*.tsbuildinfo}'
  - '!supabase/*'
  - '!docs/*'
  - '!scripts/*'
  # resources/ é entregue só via extraResources (abaixo). Não empacotar no asar,
  # senão os binários e o modelo ficariam duplicados (e o spawn falharia no asar).
  - '!resources/**'

extraResources:
  - from: resources/bin
    to: bin
    filter:
      - '**/*'
  - from: resources/imgly
    to: imgly
    filter:
      - '**/*'

win:
  target:
    - nsis
  icon: build/icon.ico
  artifactName: ${productName}-Setup-${version}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Connection Sound
  deleteAppDataOnUninstall: false

publish:
  provider: github
  owner: suporteconnectionsound
  repo: connection-sound
  releaseType: release
